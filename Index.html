
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Catatan Keuangan</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: #f0f4f8;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a202c;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .saldo-box {
            background: linear-gradient(135deg, #2b6cb0, #2c5282);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .saldo-judul { font-size: 14px; opacity: 0.9; }
        .saldo-nilai { font-size: 28px; font-weight: bold; margin-top: 5px; }
        
        .ringkas {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .ringkas div {
            flex: 1;
            padding: 15px 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
        .pemasukan { background: #f0fff4; color: #2f855a; }
        .pengeluaran { background: #fff5f5; color: #c53030; }
        
        .card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        h2 {
            font-size: 17px;
            color: #2d3748;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #38a169;
            color: white;
        }
        button:hover { background: #2f855a; }
        
        .transaksi {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid;
        }
        .masuk { background: #f0fff4; border-left-color: #38a169; }
        .keluar { background: #fff5f5; border-left-color: #e53e3e; }
        .tgl { font-size: 12px; color: #718096; margin-bottom: 4px; }
        .ket { font-weight: 500; margin-bottom: 4px; }
        .jumlah { font-weight: bold; font-size: 16px; }
        .masuk .jumlah { color: #2f855a; }
        .keluar .jumlah { color: #c53030; }
        .kosong { text-align: center; color: #718096; padding: 30px; }
    </style>
</head>
<body>

    <h1>💰 Catatan Keuangan Online</h1>

    <!-- Kotak Saldo -->
    <div class="saldo-box">
        <div class="saldo-judul">Saldo Saat Ini</div>
        <div class="saldo-nilai" id="saldo">Rp 0</div>
    </div>

    <!-- Ringkas Pemasukan & Pengeluaran -->
    <div class="ringkas">
        <div class="pemasukan">
            <div>📈 Pemasukan</div>
            <div id="totalMasuk">Rp 0</div>
        </div>
        <div class="pengeluaran">
            <div>📉 Pengeluaran</div>
            <div id="totalKeluar">Rp 0</div>
        </div>
    </div>

    <!-- Form Input -->
    <div class="card">
        <h2>➕ Tambah Transaksi</h2>
        <form id="formTransaksi">
            <label>Jenis:</label>
            <select id="jenis">
                <option value="masuk">💰 Pemasukan</option>
                <option value="keluar">📝 Pengeluaran</option>
            </select>

            <label>Keterangan:</label>
            <input type="text" id="keterangan" placeholder="Contoh: Penjualan barang" required>

            <label>Jumlah (Rp):</label>
            <input type="number" id="jumlah" placeholder="100000" required>

            <label>Tanggal:</label>
            <input type="date" id="tanggal" required>

            <button type="submit">✅ Simpan</button>
        </form>
    </div>

    <!-- Daftar Transaksi -->
    <div class="card">
        <h2>📋 Riwayat Transaksi</h2>
        <div id="daftarTransaksi">
            <p class="kosong">Belum ada transaksi. Yuk catat yang pertama!</p>
        </div>
    </div>

<script>
// ==========================================
// 🔑 TEMPEL KONFIGURASI FIREBASE KAMU DI BAWAH INI
// ==========================================
const firebaseConfig = {
   apiKey: "AIzaSyA68aU1a_Bw2ZvJSbKXok307YrKyrqK8D0",
  authDomain: "catat-keuangan-kamu.firebaseapp.com",
  projectId: "catat-keuangan-kamu",
  storageBucket: "catat-keuangan-kamu.firebasestorage.app",
  messagingSenderId: "184639033127",
  appId: "1:184639033127:web:e4284908c979ce86d36302",
  measurementId: "G-DC9E9E19FZ"
  };

// Inisialisasi Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const koleksi = db.collection("transaksi");

let daftarData = [];

// Format Angka ke Rupiah
function formatRupiah(angka) {
    return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR'
    }).format(angka);
}

// Hitung & Tampilkan Ringkas
function hitungSaldo() {
    let totalM = 0, totalK = 0;
    daftarData.forEach(item => {
        if (item.jenis === 'masuk') totalM += item.jumlah;
        else totalK += item.jumlah;
    });
    document.getElementById('totalMasuk').textContent = formatRupiah(totalM);
    document.getElementById('totalKeluar').textContent = formatRupiah(totalK);
    document.getElementById('saldo').textContent = formatRupiah(totalM - totalK);
}

// Tampilkan Semua Transaksi
function tampilkanData() {
    const wadah = document.getElementById('daftarTransaksi');
    wadah.innerHTML = '';
    
    if (daftarData.length === 0) {
        wadah.innerHTML = '<p class="kosong">Belum ada transaksi. Yuk catat yang pertama!</p>';
        hitungSaldo();
        return;
    }
    
    // Urutkan dari yang terbaru
    daftarData.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
    
    daftarData.forEach(item => {
        wadah.innerHTML += `
            <div class="transaksi ${item.jenis}">
                <div class="tgl">📅 ${item.tanggal}</div>
                <div class="ket">${item.keterangan}</div>
                <div class="jumlah">${item.jenis === 'masuk' ? '+' : '-'} ${formatRupiah(item.jumlah)}</div>
            </div>
        `;
    });
    hitungSaldo();
}

// Simpan Transaksi Baru
document.getElementById('formTransaksi').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const jenis = document.getElementById('jenis').value;
    const keterangan = document.getElementById('keterangan').value;
    const jumlah = parseInt(document.getElementById('jumlah').value);
    const tanggal = document.getElementById('tanggal').value;
    
    // Simpan ke Database Firebase
    await koleksi.add({
        jenis, keterangan, jumlah, tanggal,
        waktuDibuat: new Date()
    });
    
    // Reset Form
    this.reset();
    document.getElementById('tanggal').valueAsDate = new Date();
    
    alert('✅ Tersimpan! Terima kasih!');
});

// Ambil Data Otomatis Saat Ada Perubahan
koleksi.onSnapshot(snapshot => {
    daftarData = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
    }));
    tampilkanData();
});

// Isi Tanggal Hari Ini Otomatis
document.getElementById('tanggal').valueAsDate = new Date();

</script>

</body>
</html>
